<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning réservations – BK Émerainville</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      color: #1a1a1a;
    }
    .wrap { width: 100%; max-width: 680px; margin: 0 auto; }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; gap: 12px; flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: #D62300; display: flex; align-items: center;
      justify-content: center; font-size: 15px; color: white; font-weight: 600;
      flex-shrink: 0;
    }
    .logo h1 { font-size: 18px; font-weight: 600; }
    .logo p { font-size: 13px; color: #666; margin-top: 2px; }

    .badge-total {
      background: #D62300; color: white; font-size: 13px; font-weight: 600;
      padding: 5px 14px; border-radius: 99px; white-space: nowrap;
    }

    .nav-link {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 13px; background: white; border: 1px solid #e5e5e5;
      border-radius: 8px; font-size: 13px; font-weight: 500;
      color: #444; text-decoration: none; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-link:hover { background: #f5f5f5; border-color: #ccc; }

    .day-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .day-tab {
      flex: 1; padding: 11px; border: 1px solid #ddd;
      border-radius: 10px; background: white; color: #666;
      font-size: 14px; cursor: pointer; text-align: center;
      transition: all 0.15s; font-family: inherit; font-weight: 500;
    }
    .day-tab.active { border-color: #D62300; color: #D62300; background: #fff5f5; font-weight: 600; }

    .section-title {
      font-size: 11px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
    }

    .planning { display: flex; flex-direction: column; gap: 8px; }

    .slot-row {
      background: white; border: 1px solid #e5e5e5;
      border-radius: 12px; overflow: hidden;
    }
    .slot-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #f0f0f0;
    }
    .slot-time { font-size: 15px; font-weight: 600; }
    .slot-count {
      font-size: 12px; font-weight: 600; padding: 3px 10px;
      border-radius: 99px;
    }
    .count-ok { background: #eaf3de; color: #3B6D11; }
    .count-full { background: #fcebeb; color: #A32D2D; }
    .count-empty { background: #f0f0f0; color: #999; }

    .slot-body { padding: 10px 16px 14px; }

    .resa-list { display: flex; flex-direction: column; gap: 6px; }
    .resa-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: #f9f9f9; border-radius: 8px;
    }
    .resa-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: #D62300;
      color: white; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .resa-name { font-size: 14px; font-weight: 500; }
    .resa-time { font-size: 12px; color: #999; margin-left: auto; }

    .empty-slot {
      font-size: 13px; color: #bbb; text-align: center; padding: 8px 0;
    }

    .loader { text-align: center; padding: 3rem 1rem; color: #888; font-size: 14px; }
    .spinner {
      width: 28px; height: 28px; border: 2px solid #eee;
      border-top-color: #D62300; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #fcebeb; color: #A32D2D; border-radius: 10px;
      padding: 12px 16px; font-size: 13px;
    }

    .btn-reset {
      display: block; width: 100%; margin-top: 1.5rem;
      padding: 12px; background: white; border: 1px solid #ddd;
      border-radius: 10px; font-size: 14px; color: #A32D2D; cursor: pointer;
      font-family: inherit; font-weight: 600; transition: background 0.15s;
    }
    .btn-reset:hover { background: #fcebeb; }

    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .confirm-box {
      background: white; border-radius: 14px; padding: 1.5rem;
      max-width: 320px; width: 90%; text-align: center;
    }
    .confirm-box h3 { font-size: 17px; margin-bottom: 8px; }
    .confirm-box p { font-size: 14px; color: #666; margin-bottom: 1.25rem; }
    .confirm-actions { display: flex; gap: 8px; }
    .confirm-actions button {
      flex: 1; padding: 11px; border-radius: 9px; font-size: 14px;
      font-family: inherit; font-weight: 600; cursor: pointer; border: none;
    }
    .btn-cancel-c { background: #f0f0f0; color: #444; }
    .btn-danger { background: #D62300; color: white; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">BK</div>
        <div>
          <h1>Planning réservations</h1>
          <p>Burger King Émerainville</p>
        </div>
      </div>
      <a class="nav-link" href="index.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Réserver
      </a>
      <div class="badge-total" id="total-badge">…</div>
    </div>
    <div id="app">
      <div class="loader"><div class="spinner"></div>Chargement...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBG377KlyGO543RYR5YZQY9necmjrUmEVE",
      authDomain: "bkanimationemerainville.firebaseapp.com",
      projectId: "bkanimationemerainville",
      storageBucket: "bkanimationemerainville.firebasestorage.app",
      messagingSenderId: "312167238846",
      appId: "1:312167238846:web:b79492e2092bb21866a2ef"
    };

    const PLACES = 4;
    const HORAIRES = [
      "13h00 – 13h30","13h30 – 14h00","14h00 – 14h30","14h30 – 15h00",
      "15h00 – 15h30","15h30 – 16h00","16h00 – 16h30","16h30 – 17h00"
    ];
    const JOURS = ["Samedi","Dimanche"];

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    let state = { jour: "Samedi", slots: {}, showResetConfirm: false };

    const ref = doc(db, "semaine", "courante");
    onSnapshot(ref, snap => {
      state.slots = snap.exists() ? (snap.data() || {}) : {};
      render();
    }, err => {
      document.getElementById("app").innerHTML =
        `<div class="error-msg">Erreur de connexion : ${err.message}</div>`;
    });

    function slotId(jour, idx) { return `${jour}-${idx}`; }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    function initials(prenom, nom) {
      return ((prenom?.[0] || "") + (nom?.[0] || "")).toUpperCase();
    }

    function totalResas() {
      return Object.values(state.slots).reduce((sum, arr) => sum + (arr?.length || 0), 0);
    }

    async function resetAll() {
      await setDoc(ref, {});
      state.showResetConfirm = false;
      render();
    }

    function render() {
      const el = document.getElementById("app");
      const total = totalResas();
      document.getElementById("total-badge").textContent = `${total} réservation${total > 1 ? "s" : ""}`;

      const slotsHTML = HORAIRES.map((h, i) => {
        const id = slotId(state.jour, i);
        const resas = state.slots[id] || [];
        const nb = resas.length;
        const countCls = nb === 0 ? "count-empty" : nb >= PLACES ? "count-full" : "count-ok";
        const countLabel = nb === 0 ? "Vide" : `${nb} / ${PLACES}`;

        const resaItems = resas.length > 0
          ? resas.map(r => `
            <div class="resa-item">
              <div class="resa-avatar">${initials(r.prenom, r.nom)}</div>
              <span class="resa-name">${r.prenom} ${r.nom}</span>
              <span class="resa-time">${r.ts ? formatTime(r.ts) : ""}</span>
            </div>`).join("")
          : `<div class="empty-slot">Aucune réservation</div>`;

        return `
          <div class="slot-row">
            <div class="slot-header">
              <span class="slot-time">${h}</span>
              <span class="slot-count ${countCls}">${countLabel}</span>
            </div>
            <div class="slot-body">
              <div class="resa-list">${resaItems}</div>
            </div>
          </div>`;
      }).join("");

      const confirmHTML = state.showResetConfirm ? `
        <div class="confirm-overlay" id="overlay">
          <div class="confirm-box">
            <h3>Remettre à zéro ?</h3>
            <p>Toutes les réservations (samedi et dimanche) seront supprimées définitivement.</p>
            <div class="confirm-actions">
              <button class="btn-cancel-c" id="btn-cancel-reset">Annuler</button>
              <button class="btn-danger" id="btn-confirm-reset">Supprimer</button>
            </div>
          </div>
        </div>` : "";

      el.innerHTML = `
        <p class="section-title">Choisissez un jour</p>
        <div class="day-tabs">
          ${JOURS.map(j => `<div class="day-tab${state.jour===j?' active':''}" data-jour="${j}">${j}</div>`).join("")}
        </div>
        <p class="section-title">Créneaux – ${state.jour}</p>
        <div class="planning">${slotsHTML}</div>
        <button class="btn-reset" id="btn-reset">Remettre à zéro toutes les réservations</button>
        ${confirmHTML}
      `;

      el.querySelectorAll(".day-tab").forEach(t => {
        t.onclick = () => { state.jour = t.dataset.jour; render(); };
      });

      document.getElementById("btn-reset").onclick = () => {
        state.showResetConfirm = true; render();
      };

      if (state.showResetConfirm) {
        document.getElementById("btn-cancel-reset").onclick = () => {
          state.showResetConfirm = false; render();
        };
        document.getElementById("btn-confirm-reset").onclick = resetAll;
        document.getElementById("overlay").onclick = e => {
          if (e.target.id === "overlay") { state.showResetConfirm = false; render(); }
        };
      }
    }
  </script>
</body>
</html>
